[workspace]
resolver = "3"
members = [
    "crates/frostcore",
    "crates/egui_frost",
    "crates/bevy_frost",
    "crates/core",
]


[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/bresilla/bevy_frost"

[workspace.dependencies]
# Shared egui / egui-ecosystem dependency versions — every member
# crate pulls egui through `workspace = true` so the three crates
# compile against a single resolved egui.
egui = { version = "0.33", default-features = false }
# egui-snarl and egui_code_editor are now vendored inside
# `frostcore/src/features/` — see `ACKNOWLEDGEMENTS.md`. No
# external dep on them any more.
# bevy + bevy_egui are only used by `bevy_frost`; listed here so
# the version is managed in one place.
bevy = { version = "0.18", default-features = false }
bevy_egui = { version = "0.39", default-features = false }

# Internal crates — kept in the workspace `dependencies` table so a
# member can say `frostcore = { workspace = true }` without repeating
# the path.
frostcore = { path = "crates/frostcore", version = "0.0.1" }
# Directory is `crates/core/`; package id is `corekit` (avoids
# shadowing Rust's std `core`). Successor to `frostcore` —
# see `PLAN_NEWUI.md`.
corekit = { path = "crates/core", version = "0.0.1" }

# `mimalloc` — drop-in global allocator. egui's tessellator + shape
# `Vec`s thrash the system allocator under heavy heap pressure;
# Microsoft's `mimalloc` keeps fragmentation low and small-alloc
# throughput high. egui issue #5587 documented going from
# ~120 ms/frame to ~13 ms/frame purely by swapping allocator on
# native targets. Wired up in `bevy_frost`'s demo via
# `#[global_allocator]`.
mimalloc = { version = "0.1", default-features = false }

# ── Build profile tuning ────────────────────────────────────────────
#
# Per Bevy's "Optimisations" cheat-sheet: dev builds are 10–50× slower
# than release on hot ECS / tessellator paths because Bevy's deps
# compile at the workspace's dev `opt-level` (= 0 by default). We
# bump every dependency to `opt-level = 3` while keeping our own
# crates at `0` for fast incremental rebuilds. The single most-
# common reason "Bevy feels slow" in dev mode.

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
