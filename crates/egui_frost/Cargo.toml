[package]
name = "egui_frost"
description = "Plain-egui facade for the frost glass-themed editor UI kit. Wraps `corekit` with helpers for installing the theme + ribbon state into a standalone egui host (eframe, etc.) — no Bevy dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
# `corekit` is the entire UI core — pane / ribbon / container / pod
# systems, widgets, theme runtime, vendored fonts. `egui_frost` is
# the egui-only convenience layer on top: helpers for one-line
# theme install in eframe / standalone egui apps, plus a thin
# `RibbonState` aggregate so consumers can pass a single struct
# through their app instead of juggling four separate state types.
#
# No `bevy` feature on `corekit` here — this crate compiles in any
# environment where egui works, and stays free of Bevy types.
corekit = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
# `eframe` pairs the same egui version that corekit builds against
# (0.33). Used by the `simple` example to show how an egui-only
# app wires in the frost theme + a couple of widgets.
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
] }

[[example]]
name = "simple"
path = "examples/simple.rs"
