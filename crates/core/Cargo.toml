[package]
# Package is named `corekit` rather than `core` — Rust's standard
# library has a `core` crate that derive macros expand to via
# `::core::clone::Clone` etc. Naming our local crate `core` would
# shadow that path and break Bevy's `#[derive(SystemSet)]`. The
# directory stays as `crates/core/` (user's preferred layout); the
# crate identifier is `corekit`.
name = "corekit"
description = "Modular UI core for the bevy_frost editor kit. Hosts the flex-based pane system, ribbon strips, theme + style runtime, vendored egui_flex, and bundled Iosevka fonts. Successor to `frostcore` — see PLAN_NEWUI.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
egui = { workspace = true, default-features = false, features = ["default_fonts"] }
# Filled Fluent UI System Icons — used by `icons.rs` + `ribbon::paint`.
iconflow = { version = "1.0", default-features = false, features = ["pack-fluentui"] }
# Lab-space colour manipulation — `style.rs` uses it to adapt
# accents into the readable luma band per theme mode.
pastel = { version = "0.12", default-features = false }
# Optional Bevy integration. When OFF, the crate compiles as a
# pure-egui crate. When ON, `AccentColor` / `GlassOpacity` /
# ribbon resources derive `bevy::Resource`.
bevy = { workspace = true, optional = true }

[features]
default = []
# Enables `#[derive(bevy::Resource)]` + `bevy::SystemSet` on state
# types so they slot into a Bevy app as resources without wrappers.
bevy = ["dep:bevy"]
