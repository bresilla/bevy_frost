[package]
name = "bevy_frost"
description = "Bevy integration for the frost glass-themed editor UI kit. Wraps `corekit` with `Resource`s, a `Plugin` that installs the theme, and the transform-gizmo always-on-top material."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
# `corekit` is the entire UI core — pane / ribbon / container / pod
# systems, widgets, theme runtime, vendored fonts. `bevy_frost` is
# now just the Bevy-specific glue (resource registration, input
# firewall, gizmo material) plus the vendored extras (node graph +
# code editor) under `bevy_frost::extras::*`.
corekit = { workspace = true, features = ["bevy"] }
# Direct egui dep — needed by the vendored extras (snarl + code
# editor) which use `use egui::{...}` paths inside their own
# modules.
egui = { workspace = true }
# Transitive deps of the vendored extras — see
# `src/extras/{snarl,code_editor}`. Pinned to the same versions
# the legacy `frostcore` Cargo.toml used.
egui-scale = "0.3"
slab = "0.4"
smallvec = { version = "1.15", features = ["const_new"] }
bevy = { workspace = true, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_state",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_scene",
    "default_font",
    "tonemapping_luts",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "png",
    "x11",
    "reflect_auto_register",
] }
bevy_egui = { workspace = true, features = [
    "default_fonts",
    "render",
] }

# Faster allocator for the example/demo binary — see the
# `mimalloc` workspace dep doc for rationale. Pulled into
# `bevy_frost` directly so the framework-agnostic `corekit` stays
# allocator-neutral.
mimalloc = { workspace = true }

[features]
# Markers for the cfg-gates the vendored extras (snarl + code
# editor) carry from their upstream crates. `egui` + `editor` are
# default-on so the vendored code compiles with full egui
# integration; `serde` + `egui-probe` are no-op markers kept here
# to silence "unexpected cfg" warnings (they were stripped during
# the vendoring pass to keep the sub-crates lean).
default = ["egui", "editor"]
egui = []
editor = []
serde = []
egui-probe = []

[dev-dependencies]
# `bevy_glacial` — used by the demo example only (camera /
# scene helpers). Pulled from git so the workspace doesn't need a
# local checkout.
bevy_glacial = { git = "https://github.com/bresilla/bevy_glacial.git", rev = "d7bc6d3" }

[[example]]
name = "demo"
path = "examples/demo.rs"
